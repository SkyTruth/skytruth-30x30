[project]
name = "conservation-builder-api"
version = "0.1.0"
description = "Conservation Builder API"
authors = [
    {name = "SkyTruth"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
