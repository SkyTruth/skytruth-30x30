[project]
name = "conservation-builder-api"
version = "0.1.0"
description = "Conservation Builder API"
authors = [
    {name = "SkyTruth"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "pg8000 (>=1.31.5,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
requires-poetry = "==2.4.1"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
markers = [
    "integration: needs a live PostGIS; start one with `docker compose up -d`",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
