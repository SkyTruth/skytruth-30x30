services:
  postgis:
    image: postgis/postgis:14-3.4
    container_name: cb_api_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skytruth_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skytruth_test"]
      interval: 2s
      timeout: 3s
      retries: 15
